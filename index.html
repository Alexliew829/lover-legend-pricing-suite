<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#eef2ec" />
  <title>Lover Legend Pricing Suite</title>
  <link rel="icon" href="bonsai-price-calculator/images/icon-192.png" />
  <link rel="apple-touch-icon" href="bonsai-price-calculator/images/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef2ec;
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      overflow: hidden;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    iframe {
      display: block;
      width: 100%;
      height: 1px;
      min-height: 0;
      border: 0;
      background: #fff;
      overflow: hidden;
    }

    .mobile-divider {
      display: none;
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 0;
      }

      .layout {
        gap: 0;
      }

      .panel {
        border-radius: 0;
        box-shadow: none;
      }

      .mobile-divider {
        display: block;
        width: 100%;
        height: 0;
        border-top: 3px dashed #d60000;
        margin: 8px 0;
      }
    }
  
    .pull-refresh-indicator {
      position: fixed;
      top: 10px;
      left: 50%;
      z-index: 99999;
      min-width: 150px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.88);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -18px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .pull-refresh-indicator.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 601px) {
      .pull-refresh-indicator {
        display: none;
      }
    }


    .settings-button {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 100000;
      width: 46px;
      height: 46px;
      border: 2px solid #1e5631;
      border-radius: 12px;
      background: #fff;
      color: #1e5631;
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.16);
      touch-action: manipulation;
    }

    .settings-button:active {
      transform: scale(0.97);
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 100001;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.42);
    }

    .settings-overlay.open {
      display: flex;
    }

    .settings-dialog {
      width: min(620px, 100%);
      max-height: min(86vh, 760px);
      overflow: auto;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.28);
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid #e5e5e5;
    }

    .settings-title {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      color: #111;
    }

    .settings-subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #666;
    }

    .settings-close {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: #eee;
      color: #333;
      font-size: 24px;
      cursor: pointer;
    }

    .settings-body {
      padding: 14px 18px 4px;
    }

    .settings-section-title {
      margin: 4px 0 10px;
      color: #1e5631;
      font-size: 17px;
      font-weight: 900;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    .settings-grid-header {
      font-size: 13px;
      font-weight: 800;
      color: #555;
      text-align: center;
    }

    .settings-currency {
      font-size: 16px;
      font-weight: 900;
      color: #111;
    }

    .settings-field {
      width: 100%;
      height: 40px;
      padding: 6px 9px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #111;
      background: #fff;
    }

    .settings-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 18px 18px;
    }

    .settings-action {
      min-height: 42px;
      padding: 9px 16px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .settings-reset {
      background: #eee;
      color: #333;
    }

    .settings-save {
      margin-left: auto;
      background: #4caf50;
      color: #fff;
    }

    .settings-status {
      min-height: 20px;
      padding: 0 18px 4px;
      color: #1e5631;
      font-size: 13px;
      font-weight: 800;
    }

    @media (max-width: 600px) {
      .settings-button {
        top: 8px;
        right: 8px;
        width: 42px;
        height: 42px;
        font-size: 23px;
      }

      .settings-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .settings-dialog {
        width: 100%;
        max-height: 90vh;
        border-radius: 16px 16px 0 0;
      }

      .settings-grid {
        grid-template-columns: 66px minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
      }

      .settings-field {
        font-size: 15px;
      }
    }

  </style>
</head>

<body>

  <button id="settingsButton" class="settings-button" type="button" aria-label="系统设置" title="系统设置">⚙</button>

  <div id="settingsOverlay" class="settings-overlay" aria-hidden="true">
    <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <div>
          <h2 id="settingsTitle" class="settings-title">⚙ 系统设置</h2>
          <div class="settings-subtitle">修改后会立即同步，并保存到这台设备</div>
        </div>
        <button id="settingsClose" class="settings-close" type="button" aria-label="关闭">×</button>
      </div>

      <div class="settings-body">
        <div class="settings-section-title">汇率及海外到大马运费比例</div>
        <div class="settings-grid">
          <div></div>
          <div class="settings-grid-header">汇率</div>
          <div class="settings-grid-header">运费比例（%）</div>

          <div class="settings-currency">CNY</div>
          <input id="rateCNY" class="settings-field" inputmode="decimal" />
          <input id="freightCNY" class="settings-field" inputmode="decimal" />

          <div class="settings-currency">NTD</div>
          <input id="rateNTD" class="settings-field" inputmode="decimal" />
          <input id="freightNTD" class="settings-field" inputmode="decimal" />

          <div class="settings-currency">VND</div>
          <input id="rateVND" class="settings-field" inputmode="decimal" />
          <input id="freightVND" class="settings-field" inputmode="decimal" />

          <div class="settings-currency">IDR</div>
          <input id="rateIDR" class="settings-field" inputmode="decimal" />
          <input id="freightIDR" class="settings-field" inputmode="decimal" />
        </div>
      </div>

      <div id="settingsStatus" class="settings-status"></div>

      <div class="settings-actions">
        <button id="settingsReset" class="settings-action settings-reset" type="button">恢复默认值</button>
        <button id="settingsSave" class="settings-action settings-save" type="button">保存并同步</button>
      </div>
    </section>
  </div>
  <div id="pullRefreshIndicator" class="pull-refresh-indicator">↓ 下拉刷新</div>
  <main class="page">
    <div class="layout">
      <section class="panel" aria-label="成本与售价计算器">
        <iframe
          id="costFrame"
          src="cost-calculator/index.html?v=8.1-keep-results"
          title="成本与售价计算器"
          loading="eager"
          scrolling="no"
        ></iframe>
      </section>

      <div class="mobile-divider" aria-hidden="true"></div>

      <section class="panel" aria-label="盆景价格计算器">
        <iframe
          id="priceFrame"
          src="bonsai-price-calculator/index.html?v=3.6"
          title="盆景价格计算器"
          loading="eager"
          scrolling="no"
        ></iframe>
      </section>
    </div>
  </main>

  <script>

    const PRICING_SETTINGS_KEY = "loverLegendPricingSettingsV1";
    const DEFAULT_PRICING_SETTINGS = {
      rates: { CNY: 1.6, NTD: 7.69, VND: 6300, IDR: 3571 },
      freight: { CNY: 20, NTD: 20, VND: 84.75, IDR: 50 }
    };

    function cloneDefaultPricingSettings() {
      return JSON.parse(JSON.stringify(DEFAULT_PRICING_SETTINGS));
    }

    function normalizePricingSettings(value) {
      const result = cloneDefaultPricingSettings();
      if (!value || typeof value !== "object") return result;

      ["CNY", "NTD", "VND", "IDR"].forEach(currency => {
        const rate = Number(value.rates && value.rates[currency]);
        const freight = Number(value.freight && value.freight[currency]);

        if (Number.isFinite(rate) && rate > 0) {
          result.rates[currency] = rate;
        }
        if (Number.isFinite(freight) && freight >= 0) {
          result.freight[currency] = freight;
        }
      });

      return result;
    }

    function readPricingSettings() {
      try {
        return normalizePricingSettings(
          JSON.parse(localStorage.getItem(PRICING_SETTINGS_KEY) || "null")
        );
      } catch (error) {
        return cloneDefaultPricingSettings();
      }
    }

    function writePricingSettings(settings) {
      localStorage.setItem(
        PRICING_SETTINGS_KEY,
        JSON.stringify(normalizePricingSettings(settings))
      );
    }

    function applyPricingSettingsToSystem(settings) {
      const normalized = normalizePricingSettings(settings);
      const costFrame = document.getElementById("costFrame");

      try {
        if (
          costFrame &&
          costFrame.contentWindow &&
          typeof costFrame.contentWindow.applyPricingSettings === "function"
        ) {
          costFrame.contentWindow.applyPricingSettings(normalized);
        }
      } catch (error) {
        // 同源页面正常情况下可以同步；失败时会在下次载入自动读取。
      }
    }

    function fillSettingsForm(settings) {
      const normalized = normalizePricingSettings(settings);
      ["CNY", "NTD", "VND", "IDR"].forEach(currency => {
        document.getElementById(`rate${currency}`).value = normalized.rates[currency];
        document.getElementById(`freight${currency}`).value = normalized.freight[currency];
      });
    }

    function readSettingsForm() {
      const settings = { rates: {}, freight: {} };

      ["CNY", "NTD", "VND", "IDR"].forEach(currency => {
        const rate = Number(document.getElementById(`rate${currency}`).value);
        const freight = Number(document.getElementById(`freight${currency}`).value);

        if (!Number.isFinite(rate) || rate <= 0) {
          throw new Error(`${currency} 汇率必须大于 0`);
        }
        if (!Number.isFinite(freight) || freight < 0) {
          throw new Error(`${currency} 运费比例不能小于 0`);
        }

        settings.rates[currency] = rate;
        settings.freight[currency] = freight;
      });

      return settings;
    }

    function openSettings() {
      fillSettingsForm(readPricingSettings());
      document.getElementById("settingsStatus").textContent = "";
      const overlay = document.getElementById("settingsOverlay");
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
    }

    function closeSettings() {
      const overlay = document.getElementById("settingsOverlay");
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
    }

    document.getElementById("settingsButton").addEventListener("click", openSettings);
    document.getElementById("settingsClose").addEventListener("click", closeSettings);
    document.getElementById("settingsOverlay").addEventListener("click", event => {
      if (event.target.id === "settingsOverlay") closeSettings();
    });

    document.getElementById("settingsReset").addEventListener("click", () => {
      fillSettingsForm(cloneDefaultPricingSettings());
      document.getElementById("settingsStatus").textContent = "已载入默认值，点击“保存并同步”才会生效";
    });

    document.getElementById("settingsSave").addEventListener("click", () => {
      const status = document.getElementById("settingsStatus");

      try {
        const settings = readSettingsForm();
        writePricingSettings(settings);
        applyPricingSettingsToSystem(settings);
        status.textContent = "已保存并同步更新";
        setTimeout(closeSettings, 500);
      } catch (error) {
        status.textContent = error.message || "设置格式不正确";
      }
    });

    window.addEventListener("storage", event => {
      if (event.key === PRICING_SETTINGS_KEY) {
        applyPricingSettingsToSystem(readPricingSettings());
      }
    });

    const frameObservers = new WeakMap();

    function prepareFrame(frame) {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc || !doc.head) return;

        if (!doc.getElementById("pricing-suite-layout-fix")) {
          const style = doc.createElement("style");
          style.id = "pricing-suite-layout-fix";
          style.textContent = `
            html, body { min-height: 0 !important; }
            .app { min-height: 0 !important; }
          `;
          doc.head.appendChild(style);
        }
      } catch (error) {
        // 同源页面正常情况下可读取；失败时保留子页面原状。
      }
    }

    function getDocumentHeight(doc) {
      const body = doc.body;
      const html = doc.documentElement;

      return Math.max(
        body ? body.scrollHeight : 0,
        body ? body.offsetHeight : 0,
        body ? body.getBoundingClientRect().height : 0,
        html ? html.scrollHeight : 0,
        html ? html.offsetHeight : 0,
        html ? html.getBoundingClientRect().height : 0
      );
    }

    function fitFrame(frame) {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc || !doc.documentElement) return;

        prepareFrame(frame);

        // V8.1 Stable Frame Resize:
        // Never collapse the iframe to 1px before measuring.
        // That old technique caused the cost calculator to visibly "收起"
        // on the first Calculate after selecting an imported product.
        const currentHeight =
          parseFloat(frame.style.height) ||
          frame.getBoundingClientRect().height ||
          0;

        requestAnimationFrame(() => {
          const measuredHeight = getDocumentHeight(doc);
          if (!(measuredHeight > 0)) return;

          const targetHeight = Math.ceil(measuredHeight) + 2;
          const hasStableHeight = frame.dataset.llFrameFitted === "1";

          // First fit: use the measured content height.
          // Later fits: grow immediately when content expands, but never
          // transiently shrink during import sync / calculation redraws.
          // This prevents the one-time collapse while preserving all logic.
          if (
            !hasStableHeight ||
            currentHeight <= 0 ||
            targetHeight > currentHeight + 2
          ) {
            frame.style.height = `${targetHeight}px`;
          } else if (!frame.style.height) {
            frame.style.height = `${Math.max(targetHeight, currentHeight)}px`;
          }

          frame.dataset.llFrameFitted = "1";
        });
      } catch (error) {
        // 同源 GitHub Pages 正常情况下可以自动调整。
      }
    }

    function watchFrame(frame) {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc || !doc.body) return;

        const oldObserver = frameObservers.get(frame);
        if (oldObserver) oldObserver.disconnect();

        const observer = new ResizeObserver(() => fitFrame(frame));
        observer.observe(doc.documentElement);
        observer.observe(doc.body);
        frameObservers.set(frame, observer);
      } catch (error) {
        // 忽略无法读取 iframe 的情况。
      }
    }

    let pendingFairPrice = null;
    let fairPriceObserver = null;

    function extractFairPriceFromCostCalculator() {
      try {
        const costFrame = document.getElementById("costFrame");
        const costDoc =
          costFrame.contentDocument || costFrame.contentWindow.document;
        const result = costDoc.getElementById("result");

        if (!result) return null;

        const text = result.textContent || "";
        const match = text.match(
          /60%\s*Fair\s*售价\s*[：:]\s*RM\s*([\d,]+(?:\.\d+)?)/i
        );

        if (!match) return null;

        const value = Number(match[1].replace(/,/g, ""));
        if (!Number.isFinite(value)) return null;

        return Math.round(value);
      } catch (error) {
        return null;
      }
    }

    function applyFairPriceToBonsaiCalculator(price) {
      if (!Number.isFinite(price)) return false;

      try {
        const priceFrame = document.getElementById("priceFrame");
        const priceDoc =
          priceFrame.contentDocument || priceFrame.contentWindow.document;
        const retailInput = priceDoc.getElementById("retailPrice");

       if (!retailInput) return false;
       retailInput.value = Number(price).toFixed(2);
       retailInput.dispatchEvent(new Event("input", { bubbles: true }));
       retailInput.dispatchEvent(new Event("change", { bubbles: true }));
        
       return true;
      } catch (error) {
        return false;
      }
    }

    function syncFairPriceToBonsaiCalculator() {
      const fairPrice = extractFairPriceFromCostCalculator();
      if (!Number.isFinite(fairPrice)) return;

      pendingFairPrice = fairPrice;

      if (applyFairPriceToBonsaiCalculator(fairPrice)) {
        pendingFairPrice = null;
      }
    }

    function watchFairPriceResult() {
      try {
        const costFrame = document.getElementById("costFrame");
        const costDoc =
          costFrame.contentDocument || costFrame.contentWindow.document;
        const result = costDoc.getElementById("result");

        if (!result) return;

        if (fairPriceObserver) {
          fairPriceObserver.disconnect();
        }

        fairPriceObserver = new MutationObserver(() => {
          syncFairPriceToBonsaiCalculator();
        });

        fairPriceObserver.observe(result, {
          childList: true,
          subtree: true,
          characterData: true
        });

        syncFairPriceToBonsaiCalculator();
      } catch (error) {
        // 同源页面正常情况下可以读取；失败时不影响两个计算器。
      }
    }

    document.querySelectorAll("iframe").forEach((frame) => {
      frame.addEventListener("load", () => {
        prepareFrame(frame);

        if (frame.id === "costFrame") {
          applyPricingSettingsToSystem(readPricingSettings());
        }

        fitFrame(frame);
        watchFrame(frame);

        if (frame.id === "costFrame") {
          watchFairPriceResult();
        }

        if (
          frame.id === "priceFrame" &&
          Number.isFinite(pendingFairPrice)
        ) {
          if (applyFairPriceToBonsaiCalculator(pendingFairPrice)) {
            pendingFairPrice = null;
          }
        }

        setTimeout(() => fitFrame(frame), 150);
        setTimeout(() => fitFrame(frame), 500);
        setTimeout(() => fitFrame(frame), 1200);
      });
    });

    let resizeTimer;

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        document.querySelectorAll("iframe").forEach(fitFrame);
      }, 120);
    });


    const isMobileDevice =
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.maxTouchPoints > 1 && window.matchMedia("(pointer: coarse)").matches);

    const pullRefreshIndicator = document.getElementById("pullRefreshIndicator");
    const pullThreshold = 90;
    let pullStartY = 0;
    let pullDistance = 0;
    let pullTracking = false;
    let pullRefreshing = false;

    function showPullIndicator(distance) {
      if (!pullRefreshIndicator) return;

      pullRefreshIndicator.classList.add("show");
      pullRefreshIndicator.textContent =
        distance >= pullThreshold ? "松开刷新" : "↓ 下拉刷新";
    }

    function hidePullIndicator() {
      if (!pullRefreshIndicator) return;
      pullRefreshIndicator.classList.remove("show");
      pullRefreshIndicator.textContent = "↓ 下拉刷新";
    }

    function runPullRefresh() {
      if (pullRefreshing) return;
      pullRefreshing = true;

      if (pullRefreshIndicator) {
        pullRefreshIndicator.classList.add("show");
        pullRefreshIndicator.textContent = "正在刷新…";
      }

      const url = new URL(window.location.href);
      url.searchParams.set("_refresh", Date.now().toString());
      window.location.replace(url.toString());
    }

    function handlePullStart(event) {
      if (!isMobileDevice || pullRefreshing || window.scrollY > 0) return;
      if (!event.touches || event.touches.length !== 1) return;

      pullStartY = event.touches[0].clientY;
      pullDistance = 0;
      pullTracking = true;
    }

    function handlePullMove(event) {
      if (!pullTracking || !event.touches || event.touches.length !== 1) return;

      const currentY = event.touches[0].clientY;
      pullDistance = Math.max(0, currentY - pullStartY);

      if (pullDistance <= 0) {
        hidePullIndicator();
        return;
      }

      showPullIndicator(pullDistance);

      // 到达页面顶部后向下拉时，阻止 iOS 自己的橡皮筋滚动。
      if (event.cancelable) {
        event.preventDefault();
      }
    }

    function handlePullEnd() {
      if (!pullTracking) return;

      const shouldRefresh = pullDistance >= pullThreshold;
      pullTracking = false;
      pullDistance = 0;

      if (shouldRefresh) {
        runPullRefresh();
      } else {
        hidePullIndicator();
      }
    }

    function attachPullToRefresh(targetDocument) {
      if (!isMobileDevice || !targetDocument) return;
      if (targetDocument.__pricingSuitePullRefreshAttached) return;

      targetDocument.__pricingSuitePullRefreshAttached = true;
      targetDocument.addEventListener("touchstart", handlePullStart, { passive: true });
      targetDocument.addEventListener("touchmove", handlePullMove, { passive: false });
      targetDocument.addEventListener("touchend", handlePullEnd, { passive: true });
      targetDocument.addEventListener("touchcancel", handlePullEnd, { passive: true });
    }

    attachPullToRefresh(document);

    document.querySelectorAll("iframe").forEach(frame => {
      frame.addEventListener("load", () => {
        try {
          const doc = frame.contentDocument || frame.contentWindow.document;
          attachPullToRefresh(doc);
        } catch (error) {
          // 同源页面正常情况下可以绑定；失败时不影响计算器。
        }
      });
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const keys = await caches.keys();
          await Promise.all(
            keys
              .filter(key => key !== "lover-legend-cost-pricing-v5.2-exact-model-search")
              .map(key => caches.delete(key))
          );
        } catch (error) {}

        navigator.serviceWorker
