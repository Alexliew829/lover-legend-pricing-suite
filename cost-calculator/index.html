<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>成本与售价计算器 - 情人传奇</title>
  <style>
    body {
  font-family: sans-serif;
  padding: 8px 15px;
      background-color: #f9f9f9;
      max-width: 800px;
      margin: auto;
      -webkit-text-size-adjust: 100%;
    }
    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    h1 img { height: 40px; }
    p { text-align: center; color: #666; }

    input, select {
      width: 100%;
      padding: 8px;
      margin: 4px 0;
      box-sizing: border-box;
      font-size: 16px;
    }
    label {
      font-weight: bold;
      font-size: 15px;
    }
    .result {
      margin-top: 12px;
      background: #fff;
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
     
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background: linear-gradient(to right, #7fbf7f, #4CAF50);
      color: white;
      border: none;
      margin-top: 8px;
      border-radius: 20px;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:hover {
      background: linear-gradient(to right, #6dae6d, #3e9944);
    }

    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }

    .entry {
      font-size: 15px;
      margin: 4px 0;
      white-space: nowrap;
    }

    /* ✅ 小按钮：覆盖全局 button 样式 */
    .mini-btn{
      width: auto !important;
      padding: 4px 8px !important;
      font-size: 14px !important;
      border-radius: 10px !important;
      background: #333 !important;
      color: #fff !important;
      border: none !important;
      cursor: pointer !important;
      margin-top: 0 !important;
      line-height: 1 !important;
      white-space: nowrap !important;
      touch-action: manipulation !important;
    }

    .import-product-picker {
      position: relative;
      margin: 0 0 6px;
    }

    .import-product-picker label {
      display: block;
      margin-bottom: 3px;
      font-weight: bold;
      font-size: 15px;
    }

    .import-product-combobox {
      position: relative;
    }

    .import-product-search {
      width: 100%;
      min-height: 40px;
      padding: 7px 42px 7px 9px;
      border: 1px solid #b8c4b6;
      border-radius: 8px;
      background: #fff;
      font-size: 15px;
      color: #111;
    }

    .import-product-toggle {
      position: absolute;
      top: 1px;
      right: 1px;
      width: 40px !important;
      height: 38px;
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 0 8px 8px 0 !important;
      background: #eef4ec !important;
      color: #174f2d !important;
      font-size: 18px !important;
    }

    .import-product-options {
      position: absolute;
      z-index: 9998;
      top: calc(100% + 3px);
      left: 0;
      right: 0;
      max-height: min(330px, 52vh);
      overflow-y: auto;
      border: 1px solid #aeb9ac;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
      -webkit-overflow-scrolling: touch;
    }

    .import-product-option {
      display: block;
      width: 100% !important;
      margin: 0 !important;
      padding: 9px 10px !important;
      border: 0 !important;
      border-bottom: 1px solid #e4e9e2 !important;
      border-radius: 0 !important;
      background: #fff !important;
      color: #111 !important;
      text-align: left;
      font-size: 14px !important;
      line-height: 1.3;
    }

    .import-product-option:last-child { border-bottom: 0 !important; }
    .import-product-option:active,
    .import-product-option:hover { background: #edf6eb !important; }

    .import-product-option strong,
    .import-product-option span { display: block; }
    .import-product-option span { margin-top: 2px; color: #555; font-size: 12px; }

    .import-product-empty {
      padding: 12px;
      color: #777;
      text-align: center;
      font-size: 13px;
    }

    .import-product-status {
      min-height: 18px;
      margin-top: 2px;
      color: #666;
      font-size: 12px;
      font-weight: 700;
    }

    .import-product-status.error { color: #b22222; }

    .source-cost-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .source-cost-row .import-product-picker {
      flex: 1.35;
      min-width: 0;
      margin: 0;
    }

    .source-cost-row .import-cost-field {
      flex: 0.65;
      min-width: 175px;
    }

    .currency-freight-row > div:nth-child(1) { flex: 0.72; }
    .currency-freight-row > div:nth-child(2) { flex: 0.9; }
    .currency-freight-row > div:nth-child(3) { flex: 1.15; }

    @media (max-width: 600px) {
      .source-cost-row { gap: 5px; }
      .source-cost-row .import-product-picker { flex: 1.15; }
      .source-cost-row .import-cost-field {
        flex: 0.85;
        min-width: 135px;
      }
      .import-product-search { font-size: 14px; }
    }


  </style>
</head>

<body>
  <h1>
    <img src="Logo2.jpg" alt="情人传奇 Logo" />
    <span>成本与售价计算器</span>
    <span style="font-size:16px; color:#666; font-weight:bold; margin-left:4px;">V2.8</span>
  </h1>
  <p style="color: red; font-weight: bold; font-size: 26px; letter-spacing: 1px;">
    – Lover Legend Gardening
  </p>

  <div class="source-cost-row">
    <div class="import-product-picker">
      <label for="importProductSearch">从进口系统选择产品：</label>
      <div class="import-product-combobox">
        <input
          id="importProductSearch"
          class="import-product-search"
          type="search"
          autocomplete="off"
          placeholder="搜索或选择产品"
          aria-autocomplete="list"
          aria-controls="importProductOptions"
          aria-expanded="false"
        />
        <button id="importProductToggle" class="import-product-toggle" type="button" aria-label="展开产品">▼</button>
        <div id="importProductOptions" class="import-product-options" role="listbox" hidden></div>
      </div>
      <div id="importProductStatus" class="import-product-status"></div>
    </div>

    <div class="import-cost-field">
      <label for="price_display" style="display:flex; align-items:center; gap:6px;">
        <span>盆栽进口成本：</span>
        <button type="button" class="mini-btn" onclick="toggleCalc(true)">🧮</button>
      </label>
      <input
        id="price_display"
        onblur="formatDisplayPrice()"
        oninput="updateRawPrice()"
        type="text"
        inputmode="decimal"
        maxlength="10"
        placeholder="000,000.00"
      />
      <input id="price" type="hidden" value="" />
    </div>
  </div>

  <div class="row currency-freight-row">
    <div>
      <label for="currency">货币：</label>
      <select id="currency" onchange="setRate()">
        <option selected value="CNY">CNY</option>
        <option value="NTD">NTD</option>
        <option value="VND">VND</option>
        <option value="IDR">IDR</option>
      </select>
    </div>

    <div>
      <label for="rate">汇率：</label>
      <input id="rate" type="text" value="1.60" />
    </div>

    <div>
      <label for="freight">海外运费比例：</label>
      <input
        id="freight"
        type="text"
        inputmode="decimal"
        maxlength="6"
        value="20.00%"
        onblur="normalizeFreightInput()"
      />
    </div>
  </div>

  <div class="row">
    <div>
      <label for="inlandMisc">内地杂费：</label>
      <input
        id="inlandMisc"
        type="text"
        inputmode="decimal"
        value="0"
        onblur="formatStandardCostInput(this)"
      />
    </div>

    <div>
      <label for="malaysiaExtra">大马费用：</label>
      <input
        id="malaysiaExtra"
        type="text"
        inputmode="decimal"
        value="0"
        onblur="formatStandardCostInput(this)"
      />
    </div>
  </div>

  <div class="row">
    <div>
      <label for="pot">花盆成本：</label>
      <input id="pot" type="text" value="0" />
    </div>

    <div>
      <label style="visibility:hidden;">占位</label>
      <input type="text" value="0" style="visibility:hidden;" tabindex="-1" aria-hidden="true" />
    </div>
  </div>

<div class="row">
  <div>
    <label for="moss">苔藓成本：</label>
    <input id="moss" type="text" value="0" />
  </div>

  <div>
    <label for="local">
      本地运费：
      <span style="color:#8B0000;font-weight:bold;">
        （钉木架80）
      </span>
    </label>
    <input id="local" type="text" value="20" />
  </div>
</div>
<div class="row" style="align-items:end; gap:5px;">
  <div style="flex:0.75;">
    <label for="actualPrice">实际售价：</label>
    <input
      id="actualPrice"
      type="text"
      value="0"
      onblur="formatActualPrice()"
    />
  </div>

  <div style="flex:0.75;">
    <label for="receivedDisplay">到手金额：</label>
    <input
      id="receivedDisplay"
      type="text"
      readonly
      value="0"
    />
  </div>

  <div style="flex:0.75;">
    <label for="actualNetProfitDisplay">净利：</label>
    <input
      id="actualNetProfitDisplay"
      type="text"
      readonly
      value="0"
    />
  </div>

  <div style="flex:0.65;">
    <label for="actualMarginDisplay">利润率：</label>
    <input
      id="actualMarginDisplay"
      type="text"
      readonly
      value="0"
    />
  </div>

  <div style="flex:0.75;">
    <button onclick="calculate()" style="margin-top:0;">
      🧮 计算
    </button>
  </div>
</div>
    <div class="result" id="result"></div>

  <!-- ✅ 小计算器弹窗 -->
  <div id="calcModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:9999; touch-action: manipulation;">
    <div id="calcBox" style="
      width:min(360px, 92vw);
      background:#fff;
      border-radius:14px;
      padding:12px;
      margin:12vh auto;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    ">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong style="font-size:16px;">🧮 计算机</strong>
        <button type="button" class="mini-btn" onclick="toggleCalc(false)" style="background:#777 !important;">关闭</button>
      </div>

      <!-- ✅ readonly + inputmode none：减少 iOS 双击放大 -->
      <input
        id="calcDisplay"
        type="text"
        readonly
        inputmode="none"
        placeholder="0"
        style="
          width:100%;
          font-size:22px;
          padding:10px;
          border:1px solid #ddd;
          border-radius:10px;
          box-sizing:border-box;
          margin-bottom:10px;
          touch-action: manipulation;
          -webkit-tap-highlight-color: transparent;
          user-select: none;
          -webkit-user-select: none;
        "
      />

      <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; touch-action: manipulation;">
        <button type="button" onclick="calcKey('7')">7</button>
        <button type="button" onclick="calcKey('8')">8</button>
        <button type="button" onclick="calcKey('9')">9</button>
        <button type="button" onclick="calcKey('/')">÷</button>

        <button type="button" onclick="calcKey('4')">4</button>
        <button type="button" onclick="calcKey('5')">5</button>
        <button type="button" onclick="calcKey('6')">6</button>
        <button type="button" onclick="calcKey('*')">×</button>

        <button type="button" onclick="calcKey('1')">1</button>
        <button type="button" onclick="calcKey('2')">2</button>
        <button type="button" onclick="calcKey('3')">3</button>
        <button type="button" onclick="calcKey('-')">−</button>

        <button type="button" onclick="calcKey('0')">0</button>
        <button type="button" onclick="calcKey('.')">.</button>
        <button type="button" onclick="calcBack()">⌫</button>
        <button type="button" onclick="calcKey('+')">+</button>

        <button type="button" onclick="calcKey('(')">(</button>
        <button type="button" onclick="calcKey(')')">)</button>
        <button type="button" onclick="calcKey('%')">%</button>
        <button type="button" onclick="calcClear()">C</button>

        <button type="button" onclick="calcEval()" style="grid-column: span 2; font-weight:bold;">=</button>
        <button type="button" onclick="fillImportCost()" style="grid-column: span 2; font-weight:bold;">填入成本</button>
      </div>

      <style>
        /* ✅ 只影响计算器里面的按钮 */
        #calcModal button{
          width:auto !important;
          padding:10px !important;
          font-size:16px !important;
          border-radius:10px !important;
          border:1px solid #ddd !important;
          background:#fafafa !important;
          color:#111 !important;
          cursor:pointer !important;
          margin-top:0 !important;
          touch-action: manipulation !important;
          -webkit-tap-highlight-color: transparent !important;
          user-select: none !important;
          -webkit-user-select: none !important;
        }
        #calcModal button:hover{ background:#f0f0f0 !important; }
        #calcModal button:active{ transform: scale(0.98); }
      </style>
    </div>
  </div>

  <script>
    const defaultRates = {
  CNY: 1.6,
  NTD: 7.69,
  VND: 6300.00,
  IDR: 3571.00
};
    const defaultFreight = {
      CNY: "20%",
      NTD: "20%",
      VND: "84.75%",
      IDR: "50%"
    };

    const defaultLocal = { CNY: 0, NTD: 20, VND: 20, IDR: 20 };


    const PRICING_SETTINGS_KEY = "loverLegendPricingSettingsV1";

    function normalizeExternalPricingSettings(value) {
      const normalized = {
        rates: { ...defaultRates },
        freight: {
          CNY: parseFloat(defaultFreight.CNY),
          NTD: parseFloat(defaultFreight.NTD),
          VND: parseFloat(defaultFreight.VND),
          IDR: parseFloat(defaultFreight.IDR)
        }
      };

      if (!value || typeof value !== "object") return normalized;

      ["CNY", "NTD", "VND", "IDR"].forEach(currency => {
        const rate = Number(value.rates && value.rates[currency]);
        const freight = Number(value.freight && value.freight[currency]);

        if (Number.isFinite(rate) && rate > 0) {
          normalized.rates[currency] = rate;
        }
        if (Number.isFinite(freight) && freight >= 0) {
          normalized.freight[currency] = freight;
        }
      });

      return normalized;
    }

    function readSavedPricingSettings() {
      try {
        return normalizeExternalPricingSettings(
          JSON.parse(localStorage.getItem(PRICING_SETTINGS_KEY) || "null")
        );
      } catch (error) {
        return normalizeExternalPricingSettings(null);
      }
    }

    function applyPricingSettings(settings) {
      const normalized = normalizeExternalPricingSettings(settings);

      ["CNY", "NTD", "VND", "IDR"].forEach(currency => {
        defaultRates[currency] = normalized.rates[currency];
        defaultFreight[currency] = `${normalized.freight[currency]}%`;
      });

      const currencyInput = document.getElementById("currency");
      if (currencyInput) {
        setRate();
        clearCalculationResult(true);
      }
    }

    window.applyPricingSettings = applyPricingSettings;


    const IMPORT_UNIT_PRICE_KEY =
      "loverLegendPricingSuiteImportUnitPrices";

    let importProductRecords = [];
    let visibleImportProductRecords = [];

    function readImportUnitPriceRecords() {
      try {
        const payload = JSON.parse(
          localStorage.getItem(IMPORT_UNIT_PRICE_KEY) || "null"
        );

        return Array.isArray(payload?.records)
          ? payload.records.filter(record =>
              record &&
              record.category === "盆栽" &&
              Number(record.pricingUnitPrice || record.unitPrice) > 0 &&
              String(record.currency || "").trim()
            )
          : [];
      } catch (error) {
        return [];
      }
    }

    function formatOriginalUnitPrice(value) {
      return Number(value).toLocaleString("en-MY", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function formatAverageCostRM(value) {
      return `RM ${Number(value || 0).toLocaleString("en-MY", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;
    }

    function normalizeImportProductSearchText(value) {
      return String(value || "")
        .normalize("NFKC")
        .toLocaleLowerCase()
        .replace(/[\s\u3000\-_./\\,，、:：;；()（）[\]【】{}"'`~!！?？@#$%^&*+=|<>]+/g, "");
    }

    function unorderedImportProductMatch(sourceValue, queryValue) {
      const source = normalizeImportProductSearchText(sourceValue);
      const query = normalizeImportProductSearchText(queryValue);

      if (!query) return true;
      if (source.includes(query)) return true;

      const counts = new Map();
      Array.from(source).forEach(character => {
        counts.set(character, (counts.get(character) || 0) + 1);
      });

      return Array.from(query).every(character => {
        const count = counts.get(character) || 0;
        if (count < 1) return false;
        counts.set(character, count - 1);
        return true;
      });
    }

    function getImportProductRecordKey(record) {
      return [
        String(record?.productName || ""),
        String(record?.importNumber || ""),
        String(record?.currency || ""),
        String(record?.unitPrice || "")
      ].join("|");
    }

    function closeImportProductOptions() {
      const input = document.getElementById("importProductSearch");
      const options = document.getElementById("importProductOptions");
      if (options) options.hidden = true;
      if (input) input.setAttribute("aria-expanded", "false");
    }

    function openImportProductOptions() {
      renderImportProductOptions();
      const input = document.getElementById("importProductSearch");
      const options = document.getElementById("importProductOptions");
      if (options) options.hidden = false;
      if (input) input.setAttribute("aria-expanded", "true");
    }

    function renderImportProductOptions() {
      const searchInput = document.getElementById("importProductSearch");
      const options = document.getElementById("importProductOptions");
      const status = document.getElementById("importProductStatus");
      if (!options || !status) return;

      const keyword = String(searchInput?.value || "").trim();
      importProductRecords = readImportUnitPriceRecords();
      visibleImportProductRecords = importProductRecords.filter(record => {
        const searchable = [
          record.productName,
          record.importNumber,
          record.currency,
          record.unitPrice,
          record.pricingUnitPrice,
          record.averageCostRM,
          record.shippingRate
        ].join(" ");
        return unorderedImportProductMatch(searchable, keyword);
      });

      options.innerHTML = visibleImportProductRecords.length
        ? visibleImportProductRecords.map((record, index) => {
            const name = String(record.productName || "未命名产品");
            const number = String(record.importNumber || "无进口编号");
            const currency = String(record.currency || "").toUpperCase();
            const originalUnitPrice =
              formatOriginalUnitPrice(record.unitPrice);
            const pricingUnitPrice =
              formatOriginalUnitPrice(
                record.pricingUnitPrice || record.unitPrice
              );
            const averageCost = formatAverageCostRM(record.averageCostRM);
            const freight =
              ` · 海外运费 ${Number(record.shippingRate || 0).toFixed(2)}%`;

            return `<button type="button" class="import-product-option" role="option" data-record-index="${index}">
              <strong>${name}</strong>
              <span>${number} · 成本 ${currency} ${pricingUnitPrice} · 原单价 ${currency} ${originalUnitPrice} · 平均成本 ${averageCost}${freight}</span>
            </button>`;
          }).join("")
        : '<div class="import-product-empty">没有符合的产品</div>';

      status.classList.toggle("error", importProductRecords.length === 0);
      status.textContent = !importProductRecords.length
        ? "暂无资料，请先打开进口成本与库存系统并完成同步"
        : keyword
          ? `找到 ${visibleImportProductRecords.length} / ${importProductRecords.length} 笔产品资料`
          : `已读取 ${importProductRecords.length} 笔产品资料`;
    }

    function applySelectedImportProduct(record) {
      if (!record) return;

      const searchInput = document.getElementById("importProductSearch");
      const priceInput = document.getElementById("price_display");
      const hiddenPrice = document.getElementById("price");
      const currencyInput = document.getElementById("currency");
      const rateInput = document.getElementById("rate");
      const freightInput = document.getElementById("freight");
      const inlandMiscInput = document.getElementById("inlandMisc");
      const malaysiaExtraInput = document.getElementById("malaysiaExtra");
      const localInput = document.getElementById("local");
      const currency = String(record.currency || "").toUpperCase();
      const unitPrice = Number(record.unitPrice);
      const inlandMiscUnit = Number(
        record.inlandMiscUnitPrice ??
        (
          Number(record.pricingUnitPrice || record.unitPrice) -
          Number(record.unitPrice)
        )
      );
      const recordRate = Number(record.rate);
      const shippingRate = Number(record.shippingRate);

      if (!Number.isFinite(unitPrice) || unitPrice <= 0) return;

      if (searchInput) searchInput.value = String(record.productName || "");
      priceInput.value = formatOriginalUnitPrice(unitPrice);
      hiddenPrice.value = String(unitPrice);

      if (
        currencyInput &&
        Array.from(currencyInput.options).some(option => option.value === currency)
      ) {
        currencyInput.value = currency;
      }

      if (rateInput) {
        const finalRate = Number.isFinite(recordRate) && recordRate > 0
          ? recordRate
          : defaultRates[currency];
        rateInput.value = Number(finalRate || 0).toFixed(6);
      }

      if (freightInput) {
        const finalFreight = Number.isFinite(shippingRate) && shippingRate > 0
          ? shippingRate
          : parseFloat(defaultFreight[currency]) || 0;
        freightInput.value = `${Number(finalFreight || 0).toFixed(2)}%`;
      }

      if (inlandMiscInput) {
        inlandMiscInput.value =
          Number.isFinite(inlandMiscUnit) && inlandMiscUnit > 0
            ? inlandMiscUnit.toFixed(2)
            : "0.00";
      }

      if (malaysiaExtraInput) {
        malaysiaExtraInput.value = "0.00";
      }

      if (localInput) localInput.value = defaultLocal[currency] ?? 0;

      clearCalculationResult(true);
      autoSetPotVND();
      closeImportProductOptions();

      const status = document.getElementById("importProductStatus");
      if (status) {
        status.classList.remove("error");
        status.textContent =
          `${record.productName} · 原购买单价 ${currency} ${formatOriginalUnitPrice(unitPrice)}` +
          ` · 内地杂费 ${currency} ${formatOriginalUnitPrice(inlandMiscUnit)}` +
          ` · 平均成本 ${formatAverageCostRM(record.averageCostRM)}` +
          ` · 海外运费 ${Number(record.shippingRate || 0).toFixed(2)}% 已带入，可继续手动修改`;
      }
    }

    // =======================
    // ✅ 计算器功能

    function toggleCalc(open) {
      const modal = document.getElementById('calcModal');
      modal.style.display = open ? 'block' : 'none';

    function calcKey(k) {
      const d = document.getElementById('calcDisplay');
      d.value = (d.value || '') + k;
    }

    function calcClear() {
      document.getElementById('calcDisplay').value = '';
    }

    function calcBack() {
      const d = document.getElementById('calcDisplay');
      d.value = (d.value || '').slice(0, -1);

    function calcEval() {
  const d = document.getElementById('calcDisplay');
  const expr = (d.value || '').trim();
  if (!expr) return;

  try {
    if (!/^[0-9+\-*/().\s%]+$/.test(expr)) {
      alert('只允许输入数字和 + - * / ( ) . %');
      return;
    }

    let safeExpr = expr;

    safeExpr = safeExpr.replace(
      /(\d+(?:\.\d+)?)\s*\+\s*(\d+(?:\.\d+)?)%/g,
      '($1+($1*$2/100))'
    );

    safeExpr = safeExpr.replace(
      /(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)%/g,
      '($1-($1*$2/100))'
    );

    safeExpr = safeExpr.replace(
      /(\d+(?:\.\d+)?)%/g,
      '($1/100)'
    );

    const result = Function('"use strict"; return (' + safeExpr + ')')();

    if (typeof result === 'number' && isFinite(result)) {
      d.value = Number(result.toFixed(6));
    } else {
      alert('计算结果无效');
    }
  } catch (e) {
    alert('表达式有误，请检查');
  }
}

document.addEventListener('keydown', function(e) {
  const modal = document.getElementById('calcModal');
  const d = document.getElementById('calcDisplay');

  if (modal.style.display !== 'block') return;

  if (e.ctrlKey || e.metaKey || e.altKey) {
    if (e.key.toLowerCase() === 'a') {
      e.preventDefault();
      d.focus();
      d.select();
    }
    return;
  }

  if (/^[0-9]$/.test(e.key) || ['+','-','*','/','.','%','(',')'].includes(e.key)) {
    e.preventDefault();

    if (d.selectionStart !== d.selectionEnd) {
      d.value =
        d.value.slice(0, d.selectionStart) +
        e.key +
        d.value.slice(d.selectionEnd);
    } else {
      calcKey(e.key);
    }
  }

  if (e.key === 'Backspace') {
    e.preventDefault();

    if (d.selectionStart !== d.selectionEnd) {
      d.value =
        d.value.slice(0, d.selectionStart) +
        d.value.slice(d.selectionEnd);
    } else {
      calcBack();
    }
  }

  if (e.key === 'Delete') {
    e.preventDefault();

    if (d.selectionStart !== d.selectionEnd) {
      d.value =
        d.value.slice(0, d.selectionStart) +
        d.value.slice(d.selectionEnd);
    } else {
      calcClear();
    }
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    calcEval();
  }

  if (e.key === 'Escape') {
    e.preventDefault();
    toggleCalc(false);
  }
});
