  <style>
body {

<body>
  <h1>
    <img src="Logo2.jpg" alt="情人传奇 Logo" />
    <span>成本与售价计算器</span>
    <span style="font-size:16px; color:#666; font-weight:bold; margin-left:4px;">V8.1</span>
  </h1>
  <p style="color: red; font-weight: bold; font-size: 26px; letter-spacing: 1px;">
    – Lover Legend Gardening
  </p>

  <div class="source-cost-row">
    <div class="import-product-picker">
      <label for="importProductSearch">从进口系统选择产品：</label>
      <div class="import-product-combobox">
        <input
          id="importProductSearch"
          class="import-product-search"
          type="search"
          autocomplete="off"
          placeholder="搜索或选择产品"
          aria-autocomplete="list"
          aria-controls="importProductOptions"
          aria-expanded="false"
        />
        <button id="importProductToggle" class="import-product-toggle" type="button" aria-label="展开产品">▼</button>
        <div id="importProductOptions" class="import-product-options" role="listbox" hidden></div>
      </div>
    </div>

    <div class="import-cost-field">
      <label for="price_display" style="display:flex; align-items:center; gap:6px;">
        <span>盆栽进口成本：</span>
        <button type="button" class="mini-btn" onclick="toggleCalc(true)">🧮</button>
      </label>
      <input
        id="price_display"
        onblur="formatDisplayPrice()"
        oninput="updateRawPrice()"
        type="text"
        inputmode="decimal"
        maxlength="10"
        placeholder="000,000.00"
      />
      <input id="price" type="hidden" value="" />
    </div>
  </div>
  <div id="importProductStatus" class="import-product-status"></div>

  <div class="row currency-inland-row">
    <div>
      <label for="currency">货币：</label>
      <select id="currency" onchange="setRate()">
        <option selected value="CNY">CNY</option>
        <option value="NTD">NTD</option>
        <option value="VND">VND</option>
        <option value="IDR">IDR</option>
      </select>
    </div>

    <div>
      <label for="rate">汇率：</label>
      <input id="rate" type="text" value="1.60" />
    </div>

    <div>
      <label for="inlandMisc">内地杂费比例：</label>

        inputmode="decimal"

        value="0.00%"
        onblur="normalizeInlandMiscInput()"

  <div class="row">
    <div>

        id="freight"
        type="text"

        onblur="normalizeFreightInput()"

    <div>
      <label for="pot">花盆成本：</label>
      <input id="pot" type="text" value="0" />
    </div>
  </div>

<div class="row">
  <div>
    <label for="moss">苔藓成本：</label>
    <input id="moss" type="text" value="0" />
  </div>

  <div>
    <label for="local">
      本地运费：
      <span style="color:#8B0000;font-weight:bold;">
        （钉木架80）
      </span>
    </label>
    <input id="local" type="text" value="20" />
  </div>
</div>
<div class="row" style="align-items:end; gap:5px;">
  <div style="flex:0.75;">
    <label for="actualPrice">实际售价：</label>
    <input
      id="actualPrice"
      type="text"
      value="0"
      onblur="formatActualPrice()"
    />
  </div>

  <div style="flex:0.75;">
    <label for="receivedDisplay">到手金额：</label>
    <input
      id="receivedDisplay"
      type="text"
      readonly

    />
  </div>

  <div style="flex:0.75;">
    <label for="actualNetProfitDisplay">净利：</label>
    <input
      id="actualNetProfitDisplay"
      type="text"
      readonly
      value="0"
    />
  </div>

  <div style="flex:0.65;">
    <label for="actualMarginDisplay">利润率：</label>
    <input
      id="actualMarginDisplay"
      type="text"
      readonly
      value="0"
    />
  </div>

  <div style="flex:0.75;">
    <button onclick="calculate()" style="margin-top:0;">
      🧮 计算
    </button>
  </div>
</div>
    <div class="result" id="result"></div>

  <!-- ✅ 小计算器弹窗 -->
  <div id="calcModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:9999; touch-action: manipulation;">
    <div id="calcBox" style="
      width:min(360px, 92vw);
      background:#fff;
      border-radius:14px;
      padding:12px;
      margin:12vh auto;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    ">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong style="font-size:16px;">🧮 计算机</strong>
        <button type="button" class="mini-btn" onclick="toggleCalc(false)" style="background:#777 !important;">关闭</button>
      </div>

      <!-- ✅ readonly + inputmode none：减少 iOS 双击放大 -->
      <input
        id="calcDisplay"
        type="text"
        readonly
        inputmode="none"
        placeholder="0"
        style="
          width:100%;
          font-size:22px;
          padding:10px;
          border:1px solid #ddd;
          border-radius:10px;
          box-sizing:border-box;
          margin-bottom:10px;
          touch-action: manipulation;
          -webkit-tap-highlight-color: transparent;
          user-select: none;
          -webkit-user-select: none;
        "
      />

      <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; touch-action: manipulation;">
        <button type="button" onclick="calcKey('7')">7</button>
        <button type="button" onclick="calcKey('8')">8</button>
        <button type="button" onclick="calcKey('9')">9</button>
        <button type="button" onclick="calcKey('/')">÷</button>

        <button type="button" onclick="calcKey('4')">4</button>
        <button type="button" onclick="calcKey('5')">5</button>
        <button type="button" onclick="calcKey('6')">6</button>
        <button type="button" onclick="calcKey('*')">×</button>

        <button type="button" onclick="calcKey('1')">1</button>
        <button type="button" onclick="calcKey('2')">2</button>
        <button type="button" onclick="calcKey('3')">3</button>
        <button type="button" onclick="calcKey('-')">−</button>

        <button type="button" onclick="calcKey('0')">0</button>
        <button type="button" onclick="calcKey('.')">.</button>
        <button type="button" onclick="calcBack()">⌫</button>
        <button type="button" onclick="calcKey('+')">+</button>

        <button type="button" onclick="calcKey('(')">(</button>
        <button type="button" onclick="calcKey(')')">)</button>
        <button type="button" onclick="calcKey('%')">%</button>
        <button type="button" onclick="calcClear()">C</button>

        <button type="button" onclick="calcEval()" style="grid-column: span 2; font-weight:bold;">=</button>
        <button type="button" onclick="fillImportCost()" style="grid-column: span 2; font-weight:bold;">填入成本</button>
      </div>

      <style>
        /* ✅ 只影响计算器里面的按钮 */
        #calcModal button{
          width:auto !important;
          padding:10px !important;
          font-size:16px !important;
          border-radius:10px !important;
          border:1px solid #ddd !important;
          background:#fafafa !important;
          color:#111 !important;
          cursor:pointer !important;
          margin-top:0 !important;
          touch-action: manipulation !important;
          -webkit-tap-highlight-color: transparent !important;
          user-select: none !important;
          -webkit-user-select: none !important;
        }
        #calcModal button:hover{ background:#f0f0f0 !important; }
        #calcModal button:active{ transform: scale(0.98); }
      </style>
    </div>
  </div>

  <script>
    const defaultRates = {
  CNY: 1.6,
  NTD: 7.69,
  VND: 6300.00,
  IDR: 3571.00
};
    const defaultFreight = {
      CNY: "20%",
      NTD: "20%",
      VND: "84.75%",
      IDR: "50%"
    };

    const defaultLocal = { CNY: 0, NTD: 20, VND: 20, IDR: 20 };


    const PRICING_SETTINGS_KEY = "loverLegendPricingSettingsV1";

    function normalizeExternalPricingSettings(value) {
      const normalized = {
        rates: { ...defaultRates },
        freight: {
          CNY: parseFloat(defaultFreight.CNY),
          NTD: parseFloat(defaultFreight.NTD),
          VND: parseFloat(defaultFreight.VND),
          IDR: parseFloat(defaultFreight.IDR)
        }
      };

      if (!value || typeof value !== "object") return normalized;

      ["CNY", "NTD", "VND", "IDR"].forEach(currency => {
        const rate = Number(value.rates && value.rates[currency]);
        const freight = Number(value.freight && value.freight[currency]);

        if (Number.isFinite(rate) && rate > 0) {
          normalized.rates[currency] = rate;
        }
        if (Number.isFinite(freight) && freight >= 0) {
          normalized.freight[currency] = freight;
        }
      });

      return normalized;
    }

    function readSavedPricingSettings() {
      try {
        return normalizeExternalPricingSettings(
          JSON.parse(localStorage.getItem(PRICING_SETTINGS_KEY) || "null")
        );
      } catch (error) {
        return normalizeExternalPricingSettings(null);
      }
    }

    function applyPricingSettings(settings) {
      const normalized = normalizeExternalPricingSettings(settings);

      ["CNY", "NTD", "VND", "IDR"].forEach(currency => {
        defaultRates[currency] = normalized.rates[currency];
        defaultFreight[currency] = `${normalized.freight[currency]}%`;
      });

      const currencyInput = document.getElementById("currency");
      if (currencyInput) {
        setRate();
        clearCalculationResult(true);
      }
    }

    window.applyPricingSettings = applyPricingSettings;


    const IMPORT_UNIT_PRICE_KEY =
      "loverLegendPricingSuiteImportUnitPrices";

    const IMPORT_SYSTEM_PRODUCTS_KEY = "importSystemProducts";
    const IMPORT_SYSTEM_IMPORTS_KEY = "importSystemImports";
    const IMPORT_SYSTEM_BATCHES_KEY = "importSystemBatches";

    const IMPORT_SYSTEM_CLOUD_URL =
      "https://script.google.com/macros/s/AKfycbxWKdEC7vy_7pZ2_CPie-9L5DeIofPggZlLuwB7gW-31HqWXEOxshtCR-HB-m5qLYS6/exec";

    function getCloudBatchShippingRate(batch) {
      const hasFixedShippingRate =
        batch?.fixedShippingRate !== undefined &&
        batch?.fixedShippingRate !== null &&
        String(batch.fixedShippingRate).trim() !== "";

      if (hasFixedShippingRate) {
        const fixedShippingRate =
          parseCloudNumber(batch.fixedShippingRate);

        const historicalShippingRate =
          parseCloudNumber(
            batch?.shippingRate ??
            batch?.overseasShippingRate
          );

        if (fixedShippingRate > 0) {
          return fixedShippingRate;
        }

        if (historicalShippingRate > 0) {
          return historicalShippingRate;
        }
      }

      const shippingMY = parseCloudNumber(
        batch?.shippingMY ??
        batch?.overseasShippingMY ??
        batch?.overseasFreightMY ??
        batch?.shippingCostMY ??
        batch?.malaysiaShipping ??
        0
      );

      const rate = parseCloudNumber(
        batch?.rate ??
        batch?.exchangeRate ??
        0
      );

      if (shippingMY <= 0 || rate <= 0) return 0;

      const items = Array.isArray(batch?.items)
        ? batch.items
        : [];

      const itemsGoodsTotal = items.reduce((sum, item) => {
        const quantity = parseCloudNumber(
          item?.originalQuantity ??
          item?.stockAdded ??
          item?.quantity
        );
        const unitPrice = parseCloudNumber(item?.unitPrice);
        return sum + quantity * unitPrice;
      }, 0);

      const storedGoodsTotal = parseCloudNumber(
        batch?.foreignTotal ??
        batch?.totalGoodsForeign ??
        batch?.totalPurchaseForeign ??
        batch?.goodsForeignTotal
      );

      const goodsTotal =
        storedGoodsTotal > 0
          ? storedGoodsTotal
          : itemsGoodsTotal;

      const inlandTransport = parseCloudNumber(
        batch?.chinaTransportCost ??
        batch?.domesticTransportCost ??
        batch?.inlandTransportCost ??
        batch?.localTransportCost ??
        batch?.chinaFreight
      );

      const matchingPotCost = parseCloudNumber(
        batch?.potCost ??
        batch?.matchingPotCost ??
        batch?.pairedPotCost ??
        batch?.potTotalCost ??
        batch?.potMatchingCost
      );

      const totalForeignCost =
        goodsTotal + inlandTransport + matchingPotCost;

      if (totalForeignCost <= 0) return 0;

      return shippingMY / (totalForeignCost / rate) * 100;
    }

    function isDateLikeCorruptedNumber(value) {
      if (typeof value !== "string") return false;
      const text = value.trim();
      return /^\d{1,2}[-/]\d{1,2}[-/]\d{4}$/.test(text) ||
        /^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(text);
    }

    function parseCloudNumber(value) {
      if (typeof value === "number") {
        return Number.isFinite(value) ? value : 0;
      }

      if (isDateLikeCorruptedNumber(value)) {
        return 0;
      }

      const normalized = String(value ?? "")
        .replace(/,/g, "")
        .replace(/[^0-9.\-]/g, "")
        .trim();

      const number = Number(normalized);
      return Number.isFinite(number) ? number : 0;
    }

    function buildCloudImportProductRecords(data) {
      const imports = Array.isArray(data?.imports) ? data.imports : [];
      const batches = Array.isArray(data?.batches) ? data.batches : [];
      const products = Array.isArray(data?.products) ? data.products : [];

      const productById = new Map(
        products.map(product => [String(product?.id || ""), product])
      );

      const productByName = new Map(
        products.map(product => [
          normalizeImportProductSearchText(product?.name || ""),
          product
        ])
      );

      const normalizeImportNumber = value =>
        String(value || "").trim().toLocaleLowerCase();

      const normalizePercentValue = value => {
        const n = parseCloudNumber(value);
        if (!Number.isFinite(n) || n <= 0) return 0;
        return n > 0 && n < 1 ? n * 100 : n;
      };

      const batchesByNumber = new Map();

      batches.forEach(batch => {
        const key = normalizeImportNumber(batch?.importNumber);
        if (!key) return;

        if (!batchesByNumber.has(key)) {
          batchesByNumber.set(key, []);
        }
        batchesByNumber.get(key).push(batch);
      });

      function findMatchedItem(batch, productName) {
        if (!batch || !Array.isArray(batch?.items)) return null;

        const wanted = normalizeImportProductSearchText(productName);
        if (!wanted) return null;

        const exact = batch.items.find(item =>
          normalizeImportProductSearchText(
            item?.productName || item?.name || ""
          ) === wanted
        );
        if (exact) return exact;

        return batch.items.find(item => {
          const itemName = normalizeImportProductSearchText(
            item?.productName || item?.name || ""
          );
          return itemName &&
            (itemName.includes(wanted) || wanted.includes(itemName));
        }) || null;
      }

      function scoreBatch(batch, productName) {
        const matchedItem = findMatchedItem(batch, productName);

        const rate = parseCloudNumber(
          batch?.rate ??
          batch?.exchangeRate ??
          batch?.fixedRate
        );

        const shippingRate = normalizePercentValue(
          batch?.shippingRate ??
          batch?.fixedShippingRate ??
          batch?.overseasShippingRate ??
          batch?.overseasFreightRate
        );

        const inlandMisc = normalizePercentValue(
          batch?.inlandMiscRate ??
          batch?.inlandMiscPercent ??
          batch?.fixedInlandMiscPercent ??
          batch?.inlandMiscPercentage
        );

        const updatedAt = Date.parse(
          batch?.updatedAt || batch?.createdAt || ""
        ) || 0;

        return {
          batch,
          matchedItem,
          score:
            Number(Boolean(matchedItem)) * 100 +
            Number(rate > 0) * 10 +
            Number(inlandMisc > 0) * 5 +
            Number(shippingRate > 0) * 5,
          updatedAt
        };
      }

      function resolveImportMapping(importNumber, productName) {
        const key = normalizeImportNumber(importNumber);
        const candidates = batchesByNumber.get(key) || [];

        if (!candidates.length) {
          return { batch: null, matchedItem: null };
        }

        const scored = candidates
          .map(batch => scoreBatch(batch, productName))
          .sort((a, b) =>
            b.score - a.score ||
            b.updatedAt - a.updatedAt
          );

        return {
          batch: scored[0]?.batch || null,
          matchedItem: scored[0]?.matchedItem || null
        };
      }

      const records = [];
      const seen = new Set();

      function addRecord(source) {
        const productName = String(
          source?.productName || source?.name || ""
        ).trim();

        const category = String(source?.category || "盆栽").trim();
        const importNumber = String(source?.importNumber || "").trim();
        const currency = String(source?.currency || "")
          .trim()
          .toUpperCase();
        const unitPrice = parseCloudNumber(source?.unitPrice);

        if (
          !productName ||
          category !== "盆栽" ||
          !currency ||
          !Number.isFinite(unitPrice) ||
          unitPrice <= 0
        ) {
          return;
        }

        const key = [
          normalizeImportProductSearchText(productName),
          normalizeImportNumber(importNumber),
          currency,
          unitPrice
        ].join("|");

        if (seen.has(key)) return;
        seen.add(key);

        // V8.1: Import System V4.4 endpoint + importNumber primary relationship key.
        // Product name is used only to locate the matching item inside that batch.
        const { batch, matchedItem } =
          resolveImportMapping(importNumber, productName);

        const product =
          productById.get(String(source?.productId || "")) ||
          productByName.get(
            normalizeImportProductSearchText(productName)
          ) ||
          null;

        // Batch is the source of truth for batch-level import cost data.
        // Import row values are fallback only for old records with no batch.
        const rate =
          parseCloudNumber(
            batch?.rate ??
            batch?.exchangeRate ??
            batch?.fixedRate
          ) ||
          parseCloudNumber(
            source?.rate ??
            source?.exchangeRate ??
            source?.fixedRate
          ) ||
          0;

        const inlandMiscPercent =
          normalizePercentValue(
            batch?.inlandMiscRate ??
            batch?.inlandMiscPercent ??
            batch?.fixedInlandMiscPercent ??
            batch?.inlandMiscPercentage
          ) ||
          normalizePercentValue(
            source?.inlandMiscRate ??
            source?.inlandMiscPercent ??
            source?.fixedInlandMiscPercent ??
            source?.inlandFeePercent ??
            source?.domesticMiscPercent
          ) ||
          0;

        const shippingRate =
          normalizePercentValue(
            batch?.shippingRate ??
            batch?.fixedShippingRate ??
            batch?.overseasShippingRate ??
            batch?.overseasFreightRate
          ) ||
          normalizePercentValue(
            source?.shippingRate ??
            source?.fixedShippingRate ??
            source?.overseasShippingRate
          ) ||
          0;

        const potCost = parseCloudNumber(
          batch?.potCost ??
          batch?.matchingPotCost ??
          batch?.pairedPotCost ??
          0
        );

        const inlandTransport = parseCloudNumber(
          batch?.chinaTransportCost ??
          batch?.domesticTransportCost ??
          batch?.inlandTransportCost ??
          0
        );

        records.push({
          id: String(source?.id || key),
          productId: String(source?.productId || ""),
          productName,
          category,
          importNumber,
          unitPrice,
          currency,
          rate,
          inlandMiscPercent,
          shippingRate,
          potCost,
          inlandTransport,
          averageCostRM: parseCloudNumber(
            product?.averageCost ??
            source?.averageCostRM ??
            source?.unitCost
          ),
          fixedUnitCostRM: parseCloudNumber(
            source?.fixedUnitCostRM ??
            source?.unitCost
          ),
          // V8.1: one-way mapping only.
          // Import Cost System minimumPrice -> Pricing Calculator actualPrice.
          // No write-back API exists in this calculator.
          minimumPrice: parseCloudNumber(
            product?.minimumPrice ??
            source?.minimumPrice ??
            0
          ),
          mappingStatus: batch ? "BATCH_MATCHED" : "BATCH_MISSING",
          mappingDebug: {
            importNumber,
            productName,
            source: {
              rate: source?.rate ?? null,
              inlandMiscRate: source?.inlandMiscRate ?? null,
              inlandMiscPercent: source?.inlandMiscPercent ?? null,
              shippingRate: source?.shippingRate ?? null
            },
            batch: batch
              ? {
                  importNumber: batch?.importNumber ?? null,
                  rate: batch?.rate ?? null,
                  inlandMiscRate: batch?.inlandMiscRate ?? null,
                  inlandMiscPercent: batch?.inlandMiscPercent ?? null,
                  shippingRate: batch?.shippingRate ?? null,
                  chinaTransportCost: batch?.chinaTransportCost ?? null,
                  potCost: batch?.potCost ?? null
                }
              : null,
            matchedItem: matchedItem
              ? {
                  productName:
                    matchedItem?.productName ??
                    matchedItem?.name ??
                    null,
                  unitPrice: matchedItem?.unitPrice ?? null
                }
              : null
          },
          updatedAt: String(
            source?.updatedAt ||
            source?.createdAt ||
            batch?.updatedAt ||
            batch?.createdAt ||
            ""
          )
        });
      }

      // Imports is the canonical product import list.
      imports.forEach(addRecord);

      records.sort((a, b) =>
        a.productName.localeCompare(
          b.productName,
          "zh-Hans-CN",
          { numeric: true, sensitivity: "base" }
        )
      );

      return records;
    }

    function readSharedImportSystemCollection(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || "null");
        return Array.isArray(value) ? value : [];
      } catch (error) {
        return [];
      }
    }

    function syncImportProductsFromSharedLocalStorage() {
      const products =
        readSharedImportSystemCollection(IMPORT_SYSTEM_PRODUCTS_KEY);
      const imports =
        readSharedImportSystemCollection(IMPORT_SYSTEM_IMPORTS_KEY);
      const batches =
        readSharedImportSystemCollection(IMPORT_SYSTEM_BATCHES_KEY);

      if (!products.length || !imports.length) {
        return 0;
      }

      const records = buildCloudImportProductRecords({
        products,
        imports,
        batches
      });

      if (!records.length) {
        return 0;
      }

      localStorage.setItem(
        IMPORT_UNIT_PRICE_KEY,
        JSON.stringify({
          version: 20,
          exportedAt: new Date().toISOString(),
          source: "import-system-local",
          records
        })
      );

      renderImportProductOptions();
      return records.length;
    }

    let importProductsRefreshPromise = null;
    let importProductsCloudReady = false;
    let activeImportProductKey = "";
    let actualPriceManuallyEdited = false;

    async function refreshImportProductsFromCloud() {
      if (importProductsRefreshPromise) {
        return importProductsRefreshPromise;
      }

      importProductsRefreshPromise = (async () => {
      const status = document.getElementById("importProductStatus");

      try {
        const directLocalCount =
          syncImportProductsFromSharedLocalStorage();

        if (status && !directLocalCount) {
          status.classList.remove("error");
          status.textContent = "正在读取进口系统产品…";
        }

        const response = await fetch(IMPORT_SYSTEM_CLOUD_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "pull",
            knownRevision: 0,
            hasLocalData: false,
            forceFull: true
          }),
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (
          !data?.ok ||
          !Array.isArray(data.products) ||
          !Array.isArray(data.imports) ||
          !Array.isArray(data.batches)
        ) {
          throw new Error(data?.error || "云端资料不完整");
        }

        const records = buildCloudImportProductRecords(data);

        localStorage.setItem(
          IMPORT_UNIT_PRICE_KEY,
          JSON.stringify({
            version: 20,
            exportedAt: new Date().toISOString(),
            records
          })
        );

        importProductsCloudReady = true;
        renderImportProductOptions();
        return records.length;
      } catch (error) {
        renderImportProductOptions();

        const localRecords = readImportUnitPriceRecords();
        if (!localRecords.length && status) {
          status.classList.add("error");
          status.textContent =
            "无法读取产品，请确认网络及进口系统云端同步";
        }

        console.warn("读取进口系统云端产品失败", error);
        return localRecords.length;
      }
      })();

      try {
        return await importProductsRefreshPromise;
      } finally {
        importProductsRefreshPromise = null;
      }
    }

    function findFreshImportProductRecord(record) {
      if (!record) return null;

      const targetKey = getImportProductRecordKey(record);
      const records = readImportUnitPriceRecords();

      return records.find(item =>
        getImportProductRecordKey(item) === targetKey
      ) || null;
    }

    function applyLatestMinimumPriceOnly(record) {
      if (!record) return;

      const actualPriceInput = document.getElementById("actualPrice");
      if (!actualPriceInput) return;

      const minimumPrice = Number(record.minimumPrice ?? 0);
      const safeMinimumPrice =
        Number.isFinite(minimumPrice) && minimumPrice >= 0
          ? minimumPrice
          : 0;

      actualPriceInput.value = safeMinimumPrice.toFixed(2);

      // V8.1 Final:
      // This update can happen after the first Calculate because cloud sync
      // finishes asynchronously. Never clear the calculation result here.
      // Otherwise the first result disappears before the user can read it.

      const status = document.getElementById("importProductStatus");
      if (status) {
        status.classList.remove("error");
        status.textContent =
          `已更新最新最低售价 RM ${safeMinimumPrice.toFixed(2)}`;
      }
    }

    function applySelectedImportProductFast(record) {
      if (!record) return;

      // V8.1 Direct Local Sync:
      // Import System and Pricing Suite are under the same origin.
      // Read Import System's own localStorage synchronously first.
      syncImportProductsFromSharedLocalStorage();

      const freshestLocal =
        findFreshImportProductRecord(record) || record;

      activeImportProductKey =
        getImportProductRecordKey(freshestLocal);
      actualPriceManuallyEdited = false;

      // Selection is immediate; network never blocks the click.
      applySelectedImportProduct(freshestLocal);

      if (importProductsCloudReady) return;

      const selectedKey = activeImportProductKey;

      void refreshImportProductsFromCloud()
        .then(() => {
          if (selectedKey !== activeImportProductKey) return;
          if (actualPriceManuallyEdited) return;

          // Re-read Import System's shared local data after cloud fallback.
          syncImportProductsFromSharedLocalStorage();

          const latestRecord =
            findFreshImportProductRecord(freshestLocal) ||
            freshestLocal;

          applyLatestMinimumPriceOnly(latestRecord);
        })
        .catch(error => {
          console.warn(
            "后台更新最新最低售价失败，保留本机最新资料",
            error
          );
        });
    }

    let importProductRecords = [];
    let visibleImportProductRecords = [];

    function readImportUnitPriceRecords() {
      try {
        const payload = JSON.parse(
          localStorage.getItem(IMPORT_UNIT_PRICE_KEY) || "null"
        );

        return Array.isArray(payload?.records)
          ? payload.records.filter(record =>
              record &&
              record.category === "盆栽" &&
              Number(record.pricingUnitPrice || record.unitPrice) > 0 &&
              String(record.currency || "").trim()
            )
          : [];
      } catch (error) {
        return [];
      }
    }

    function formatOriginalUnitPrice(value) {
      return Number(value).toLocaleString("en-MY", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function formatAverageCostRM(value) {
      return `RM ${Number(value || 0).toLocaleString("en-MY", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;
    }

    function normalizeImportProductSearchText(value) {
      return String(value || "")
        .normalize("NFKC")
        .toLocaleLowerCase()
        .replace(/[\s\u3000\-_./\\,，、:：;；()（）[\]【】{}"'`~!！?？@#$%^&*+=|<>]+/g, "");
    }

    function extractImportProductCodes(value) {
      const source = String(value || "")
        .normalize("NFKC")
        .toLocaleLowerCase();

      return source.match(/[a-z]{1,6}[0-9][a-z0-9]*/g) || [];
    }

    function isExactProductCodeQuery(value) {
      const query = normalizeImportProductSearchText(value);
      return /^[a-z]{1,6}[0-9][a-z0-9]*$/.test(query);
    }

    function unorderedImportProductMatch(sourceValue, queryValue) {
      const source = normalizeImportProductSearchText(sourceValue);
      const query = normalizeImportProductSearchText(queryValue);

      if (!query) return true;

      // V5.1：型号搜索必须完整相同。
      // 例如 BX580 只匹配 BX580，不再误配 BX1680、BX780、BX980。
      if (isExactProductCodeQuery(query)) {
        return extractImportProductCodes(sourceValue)
          .some(code => code === query);
      }

      if (source.includes(query)) return true;

      // 中文关键词保留不按字序搜索：例如“高提根”和“提根高”都能找到。
      // 英文、数字或中英混合查询不再采用逐字乱序匹配，避免无关结果。
      if (!/^[\p{Script=Han}]+$/u.test(query)) {
        return false;
      }

      const counts = new Map();
      Array.from(source).forEach(character => {
        counts.set(character, (counts.get(character) || 0) + 1);
      });

      return Array.from(query).every(character => {
        const count = counts.get(character) || 0;
        if (count < 1) return false;
        counts.set(character, count - 1);
        return true;
      });
    }

    function getImportProductRecordKey(record) {
      return [
        String(record?.productName || ""),
        String(record?.importNumber || ""),
        String(record?.currency || ""),
        String(record?.unitPrice || "")
      ].join("|");
    }

    function closeImportProductOptions() {
      const input = document.getElementById("importProductSearch");
      const options = document.getElementById("importProductOptions");
      const backdrop = document.getElementById("mobileProductBackdrop");

      if (options) options.hidden = true;
      if (backdrop) backdrop.remove();
      if (input) input.setAttribute("aria-expanded", "false");
    }

    function openImportProductOptions() {
      const input = document.getElementById("importProductSearch");
      const options = document.getElementById("importProductOptions");
      const isMobile = window.matchMedia("(max-width: 600px)").matches;

      if (isMobile && input) {
        input.readOnly = true;
        input.blur();
      }

      renderImportProductOptions();

      if (isMobile && !document.getElementById("mobileProductBackdrop")) {
        const backdrop = document.createElement("div");
        backdrop.id = "mobileProductBackdrop";
        backdrop.className = "mobile-product-backdrop";
        document.body.appendChild(backdrop);
      }

      if (options) options.hidden = false;
      if (input) input.setAttribute("aria-expanded", "true");

      if (isMobile) {
        requestAnimationFrame(() => {
          const mobileSearch =
            document.getElementById("mobileImportProductSearch");
          mobileSearch?.focus({ preventScroll: true });
        });
      }
    }

    function ensureMobileImportSearchUI(options) {
      if (!window.matchMedia("(max-width: 600px)").matches) {
        return options;
      }

      let searchWrap =
        options.querySelector(".mobile-product-search-wrap");
      let searchInput =
        document.getElementById("mobileImportProductSearch");
      let list =
        options.querySelector(".import-product-list");

      if (!searchWrap) {
        searchWrap = document.createElement("div");
        searchWrap.className = "mobile-product-search-wrap";

        const row = document.createElement("div");
        row.className = "mobile-product-search-row";

        searchInput = document.createElement("input");
        searchInput.id = "mobileImportProductSearch";
        searchInput.className = "mobile-product-search";
        searchInput.type = "text";
        searchInput.autocomplete = "off";
        searchInput.autocapitalize = "off";
        searchInput.spellcheck = false;
        searchInput.placeholder = "输入中文或产品编号搜索";

        const closeButton = document.createElement("button");
        closeButton.id = "mobileProductClose";
        closeButton.className = "mobile-product-close";
        closeButton.type = "button";
        closeButton.textContent = "×";
        closeButton.setAttribute("aria-label", "关闭产品列表");

        row.appendChild(searchInput);
        row.appendChild(closeButton);
        searchWrap.appendChild(row);
        options.appendChild(searchWrap);
      }

      if (!list) {
        list = document.createElement("div");
        list.className = "import-product-list";
        options.appendChild(list);
      }

      return list;
    }

    function renderImportProductOptions() {
      const searchInput = document.getElementById("importProductSearch");
      const options = document.getElementById("importProductOptions");
      const status = document.getElementById("importProductStatus");
      if (!options || !status) return;

      const isMobile =
        window.matchMedia("(max-width: 600px)").matches;
      const mobileSearchInput =
        document.getElementById("mobileImportProductSearch");

      const keyword = String(
        isMobile && mobileSearchInput
          ? mobileSearchInput.value
          : searchInput?.value || ""
      ).trim();

      importProductRecords = readImportUnitPriceRecords();
      visibleImportProductRecords = importProductRecords.filter(record => {
        const searchable = [
          record.productName,
          record.importNumber,
          record.currency,
          record.unitPrice,
          record.pricingUnitPrice,
          record.averageCostRM,
          record.shippingRate,
          record.inlandMiscPercent
        ].join(" ");

        return unorderedImportProductMatch(searchable, keyword);
      });

      const listTarget = isMobile
        ? ensureMobileImportSearchUI(options)
        : options;

      const previousScrollTop = listTarget.scrollTop;

      listTarget.innerHTML = visibleImportProductRecords.length
        ? visibleImportProductRecords.map((record, index) => {
            const name = String(record.productName || "未命名产品");
            const number = String(record.importNumber || "无进口编号");
            const currency = String(record.currency || "").toUpperCase();
            const originalUnitPrice =
              formatOriginalUnitPrice(record.unitPrice);
            const averageCost =
              formatAverageCostRM(record.averageCostRM);
            const inland =
              ` · 内地杂费 ${Number(
                record.inlandMiscPercent || 0
              ).toFixed(2)}%`;
            const freight =
              ` · 海外运费 ${Number(
                record.shippingRate || 0
              ).toFixed(2)}%`;

            return `<button type="button" class="import-product-option" role="option" data-record-index="${index}">
              <strong>${name}</strong>
              <span>${number} · 原单价 ${currency} ${originalUnitPrice} · 平均成本 ${averageCost}${inland}${freight}</span>
            </button>`;
          }).join("")
        : '<div class="import-product-empty">没有符合的产品</div>';

      listTarget.scrollTop = previousScrollTop;

      if (isMobile && mobileSearchInput) {
        requestAnimationFrame(() => {
          if (!options.hidden) {
            mobileSearchInput.focus({ preventScroll: true });
          }
        });
      }

      status.classList.toggle(
        "error",
        importProductRecords.length === 0
      );

      status.textContent = !importProductRecords.length
        ? "暂无资料，请先打开进口成本与库存系统并完成同步"
        : keyword
          ? `找到 ${visibleImportProductRecords.length} / ${importProductRecords.length} 笔产品资料`
          : `已读取 ${importProductRecords.length} 笔产品资料`;
    }


    function applySelectedImportProduct(record) {
      if (!record) return;


      const searchInput = document.getElementById("importProductSearch");
      const priceInput = document.getElementById("price_display");
      const hiddenPrice = document.getElementById("price");
      const currencyInput = document.getElementById("currency");
      const rateInput = document.getElementById("rate");
      const freightInput = document.getElementById("freight");
      const inlandMiscInput = document.getElementById("inlandMisc");
      const localInput = document.getElementById("local");
      const actualPriceInput = document.getElementById("actualPrice");
      const currency = String(
        record.currency ??
        record.money ??
        ""
      ).toUpperCase();

      const unitPrice = Number(
        record.unitPrice ??
        record.price ??
        record.purchasePrice ??
        0
      );

      // Import System fields compatibility
      // Accept both decimal (0.395) and percentage (39.5)
      const normalizePercent = value => {
        const n = Number(value);
        if (!Number.isFinite(n)) return 0;
        return n > 0 && n < 1 ? n * 100 : n;
      };

      const inlandMiscPercent = normalizePercent(
        record.inlandMiscPercent ??
        record.inlandMiscRate ??
        record.inlandFeePercent ??
        record.domesticMiscPercent ??
        record["内地杂费比例"] ??
        0
      );

      const recordRate = Number(
        record.rate ??
        record.exchangeRate ??
        record.fxRate ??
        0
      );

      const shippingRate = normalizePercent(
        record.shippingRate ??
        record.overseasShippingRate ??
        record.fixedShippingRate ??
        record["海外运费比例"] ??
        0
      );

      const minimumPrice = Number(record.minimumPrice ?? 0);

      if (!Number.isFinite(unitPrice) || unitPrice <= 0) return;

      if (searchInput) searchInput.value = String(record.productName || "");
      priceInput.value = formatOriginalUnitPrice(unitPrice);
      hiddenPrice.value = String(unitPrice);

      if (
        currencyInput &&
        Array.from(currencyInput.options).some(option => option.value === currency)
      ) {
        currencyInput.value = currency;
      }

      if (rateInput) {
        const finalRate = Number.isFinite(recordRate) && recordRate > 0
          ? recordRate
          : defaultRates[currency];
        rateInput.value = Number(finalRate || 0).toFixed(6);
      }

      if (freightInput) {
        const finalFreight = Number.isFinite(shippingRate) && shippingRate > 0
          ? shippingRate
          : parseFloat(defaultFreight[currency]) || 0;
        freightInput.value = `${Number(finalFreight || 0).toFixed(2)}%`;
      }

      if (inlandMiscInput) {
        inlandMiscInput.value =
          `${(
            Number.isFinite(inlandMiscPercent) && inlandMiscPercent > 0
              ? inlandMiscPercent
              : 0
          ).toFixed(2)}%`;
      }

      if (localInput) localInput.value = defaultLocal[currency] ?? 0;

      clearCalculationResult(true);

      // V8.1: minimumPrice is only the initial value for actualPrice.
      // The user can edit actualPrice freely afterward.

    function calcEval() {
  const d = document.getElementById('calcDisplay');
  const expr = (d.value || '').trim();
  if (!expr) return;

  try {
    if (!/^[0-9+\-*/().\s%]+$/.test(expr)) {
      alert('只允许输入数字和 + - * / ( ) . %');
      return;
    }

    let safeExpr = expr;

    safeExpr = safeExpr.replace(
      /(\d+(?:\.\d+)?)\s*\+\s*(\d+(?:\.\d+)?)%/g,
      '($1+($1*$2/100))'
    );

    safeExpr = safeExpr.replace(
      /(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)%/g,
      '($1-($1*$2/100))'
    );

    safeExpr = safeExpr.replace(
      /(\d+(?:\.\d+)?)%/g,
      '($1/100)'
    );

    const result = Function('"use strict"; return (' + safeExpr + ')')();

    if (typeof result === 'number' && isFinite(result)) {
      d.value = Number(result.toFixed(6));
    } else {

document.addEventListener('keydown', function(e) {
  const modal = document.getElementById('calcModal');
  const d = document.getElementById('calcDisplay');

  if (modal.style.display !== 'block') return;

  if (e.ctrlKey || e.metaKey || e.altKey) {
    if (e.key.toLowerCase() === 'a') {
      e.preventDefault();
      d.focus();
      d.select();
    }
    return;
  }

  if (/^[0-9]$/.test(e.key) || ['+','-','*','/','.','%','(',')'].includes(e.key)) {
    e.preventDefault();

    if (d.selectionStart !== d.selectionEnd) {
      d.value =
        d.value.slice(0, d.selectionStart) +
        e.key +
        d.value.slice(d.selectionEnd);
    } else {
      calcKey(e.key);
    }
  }

  if (e.key === 'Backspace') {
    e.preventDefault();

    if (d.selectionStart !== d.selectionEnd) {
      d.value =
        d.value.slice(0, d.selectionStart) +
        d.value.slice(d.selectionEnd);
    } else {
      calcBack();
    }
  }

  if (e.key === 'Delete') {
    e.preventDefault();

    if (d.selectionStart !== d.selectionEnd) {
      d.value =
        d.value.slice(0, d.selectionStart) +
        d.value.slice(d.selectionEnd);
    } else {
      calcClear();
    }
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    calcEval();
  }

  if (e.key === 'Escape') {
    e.preventDefault();
    toggleCalc(false);
  }
});

    void refreshImportProductsFromCloud();
  }, 1200);

    document.getElementById("importProductSearch");
  const importProductToggle =
    document.getElementById("importProductToggle");
  const importProductOptions =
    document.getElementById("importProductOptions");

  if (window.matchMedia("(max-width: 600px)").matches && importProductSearch) {
    importProductSearch.readOnly = true;

    });

    event.preventDefault();
    openImportProductOptions();
  });

  importProductToggle?.addEventListener("click", event => {
    event.preventDefault();
    if (importProductOptions?.hidden) {
      if (!window.matchMedia("(max-width: 600px)").matches) {
        importProductSearch?.focus();
      }
      openImportProductOptions();
    } else {
      closeImportProductOptions();
    }
  });

  let lastImportProductChoiceAt = 0;

  const chooseImportProduct = event => {
    const option = event.target.closest(".import-product-option");
    if (!option) return;

    const now = Date.now();
    if (now - lastImportProductChoiceAt < 350) return;
    lastImportProductChoiceAt = now;

    event.preventDefault();
    event.stopPropagation();

    const record =
      visibleImportProductRecords[Number(option.dataset.recordIndex)];

    applySelectedImportProductFast(record);
  };

  let productTouchStartX = 0;
  let productTouchStartY = 0;
  let productTouchMoved = false;

  importProductOptions?.addEventListener("touchstart", event => {
    if (!event.touches || event.touches.length !== 1) return;
    productTouchStartX = event.touches[0].clientX;
    productTouchStartY = event.touches[0].clientY;
    productTouchMoved = false;
  }, { passive: true });

  importProductOptions?.addEventListener("touchmove", event => {
    if (!event.touches || event.touches.length !== 1) return;

    const dx = Math.abs(event.touches[0].clientX - productTouchStartX);
    const dy = Math.abs(event.touches[0].clientY - productTouchStartY);

    if (dx > 8 || dy > 8) {
      productTouchMoved = true;
    }
  }, { passive: true });

  importProductOptions?.addEventListener("click", event => {
    if (productTouchMoved) {
      event.preventDefault();
      event.stopPropagation();
      productTouchMoved = false;
      return;
    }

    chooseImportProduct(event);
  });

  let mobileImportSearchComposing = false;
  let mobileImportSearchTimer = 0;

  importProductOptions?.addEventListener(
    "compositionstart",
    event => {
      if (event.target.id !== "mobileImportProductSearch") return;
      mobileImportSearchComposing = true;
    }
  );

  importProductOptions?.addEventListener(
    "compositionend",
    event => {
      if (event.target.id !== "mobileImportProductSearch") return;
      mobileImportSearchComposing = false;
      clearTimeout(mobileImportSearchTimer);
      mobileImportSearchTimer = window.setTimeout(() => {
        renderImportProductOptions();
      }, 80);
    }
  );

  importProductOptions?.addEventListener("input", event => {
    if (event.target.id !== "mobileImportProductSearch") return;
    if (mobileImportSearchComposing || event.isComposing) return;

    clearTimeout(mobileImportSearchTimer);
    mobileImportSearchTimer = window.setTimeout(() => {
      renderImportProductOptions();

      closeImportProductOptions();
      importProductSearch?.blur();
    }
  });

    .forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;

      // so hide/clear the old result, but preserve actualPrice/minimumPrice.

      el.addEventListener('change', clearOldQuote);
    });

  const actualPriceInput = document.getElementById('actualPrice');

    actualPriceInput.addEventListener('input', () => {
      actualPriceManuallyEdited = true;
      clearCalculationResult(false);
    });
  }

  const rerenderImportProducts = () => {
    const mobileSearch =
      document.getElementById("mobileImportProductSearch");

      openImportProductOptions();

  window.addEventListener("pageshow", () => {
    document.getElementById("mobileProductBackdrop")?.remove();
    const options = document.getElementById("importProductOptions");
    if (options) options.hidden = true;
    syncImportProductsFromSharedLocalStorage();
    rerenderImportProducts();
  });

  window.addEventListener("focus", () => {
    syncImportProductsFromSharedLocalStorage();
    rerenderImportProducts();
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      syncImportProductsFromSharedLocalStorage();
      rerenderImportProducts();
    }
  });
};
